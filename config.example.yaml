# MongoDB
mongo_uri: mongodb://localhost:27017
mongo_db: poly_house_dev

# Polymarket Gateway
gateway_url: http://localhost:8080

# sync-event --watch: период между стартами прогонов, сек (время работы вычитается из паузы)
sync_event_watch_interval: 1800

# sync-orderbook --watch: период между стартами прогонов, сек
sync_orderbook_watch_interval: 60

# sync-orderbook: хранить best_prices не дольше N секунд
best_prices_window: 86400

# sync-trade --watch: период между стартами прогонов, сек
sync_trade_watch_interval: 86400

# sync-holder --watch: период между стартами прогонов, сек
sync_holder_watch_interval: 86400

# первый прогон: загружать events, обновлявшиеся за последние N дней
updated_in_days: 30

# первый прогон refresh-home-profile: activity cache за последние N дней (источник: Gateway /data/closed-positions)
activity_cache_in_days: 365

# refresh-profile: считать profile свежим, если synced_at моложе N дней
profile_refresh_interval_days: 1

# refresh-home-profile: считать home profile свежим, если synced_at моложе N дней
home_profile_refresh_interval_days: 1

# необязательный фильтр events по тегам, пусто = без фильтра
# events_tag_ids:
#   - 2
#   - 100265

# исключить events с этими тегами (exclude_tag_id в API)
# events_exclude_tag_ids:
#   - 1

# необязательный фильтр events по slug, пусто = без фильтра
# events_slugs:
#   - fed-decision-in-october
#   - some-other-event

# пропускать event, если среди nested markets есть outcomes != ["Yes", "No"]
# markets_yes_no_only: true

# оставлять только events с neg_risk == значению (null/absent в API = false)
# events_neg_risk: false

# размеры страниц API
# /gamma/events: max limit = 100
events_page_limit: 100
trades_page_limit: 1000
trades_max_offset: 3000

# sync-holder: лимит Gateway /data/holders (max 500)
holders_limit: 500

# activity: пагинация Gateway /data/activity
activity_page_limit: 500
activity_max_offset: 3000

# activity cache: пагинация Gateway /data/positions?status=CLOSED
activity_cache_page_limit: 50
activity_cache_max_offset: 100000

# REST API
server_host: 127.0.0.1
server_port: 8000
